<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1c2230; --muted: #667085; --line: #e3e6ec;
    --ok: #12805c; --bad: #b42318; --bad-bg: #fdebe9; --accent: #2f5bea;
    --warn-bg: #fff6e0; --warn-line: #f0d08a; --warn-text: #6b4a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --card: #1b2029; --text: #eef1f6; --muted: #98a2b3; --line: #2b3240;
      --ok: #4cc79a; --bad: #ff8a80; --bad-bg: #3a1b19; --accent: #7e9bff;
      --warn-bg: #3a2f10; --warn-line: #6b5518; --warn-text: #f3d58a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; }
  .src { color: var(--muted); font-size: 13px; margin-top: 2px; }
  button { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--line); background: var(--card); color: var(--text); }
  button:hover { border-color: var(--accent); color: var(--accent); }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
  .kpi .label { color: var(--muted); font-size: 14px; }
  .kpi .num { font-size: 56px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi .sub { color: var(--muted); font-size: 13px; min-height: 1.4em; }
  .kpi.ok .num { color: var(--ok); }
  .kpi.bad .num { color: var(--bad); }
  .tables { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--line); font-size: 14px; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  tfoot td { font-weight: 700; border-bottom: 0; }
  td.ok { color: var(--ok); } td.bad { color: var(--bad); }
  .pct { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .track { width: 48px; height: 8px; background: var(--bad-bg); border-radius: 4px; overflow: hidden; flex: none; }
  .fill { height: 100%; background: var(--ok); }
  .msg { color: var(--bad); font-size: 14px; margin: 0 0 12px; display: none; }
  .warn { display: none; background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-text);
          border-radius: 10px; padding: 10px 14px; margin: 0 0 16px; font-size: 14px; }
  .warn ul { margin: 0; padding-left: 18px; }
  @media (max-width: 760px) {
    .tables { grid-template-columns: 1fr; }
    .kpi .num { font-size: 40px; }
    .kpis { gap: 8px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .kpi { padding: 14px 12px; }
    .kpi .label { font-size: 12px; }
  }
  @media (max-width: 480px) {
    section { padding: 12px 10px; }
    th, td { padding: 8px 3px; font-size: 13px; }
    th { font-size: 11px; }
    .track { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Регистрации на мероприятие</h1>
      <div class="src" id="src"></div>
    </div>
    <div>
      <button id="load">Загрузить CSV…</button>
      <input type="file" id="file" accept=".csv,text/csv" hidden>
    </div>
  </header>
  <p class="msg" id="msg"></p>
  <div class="warn" id="warn"></div>

  <div class="kpis">
    <div class="kpi"><div class="label">Всего</div><div class="num" id="k-total">0</div><div class="sub">регистраций</div></div>
    <div class="kpi ok"><div class="label">Оплатили</div><div class="num" id="k-paid">0</div><div class="sub" id="k-paid-pct"></div></div>
    <div class="kpi bad"><div class="label">Не оплатили</div><div class="num" id="k-unpaid">0</div><div class="sub" id="k-unpaid-pct"></div></div>
  </div>

  <div class="tables">
    <section>
      <h2>По каналам (откуда пришли)</h2>
      <table id="t-source"></table>
    </section>
    <section>
      <h2>По городам</h2>
      <table id="t-city"></table>
    </section>
  </div>
</div>

<script>
(function () {
  var PAID_YES = ["да", "yes", "true", "1", "оплачено", "paid", "y"];
  var PAID_NO = ["нет", "no", "false", "0", "не оплачено", "неоплачено", "unpaid", "n"];
  var ID_COLS = ["name", "имя", "фио", "email", "e-mail", "почта", "phone", "телефон", "id"];

  function clean(s) { return String(s == null ? "" : s).replace(/\s+/g, " ").trim(); }
  function keyOf(s) { return clean(s).toLowerCase().replace(/ё/g, "е"); }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function pct(a, b) { return b ? Math.round(a * 100 / b) : 0; }

  // Кодировка: сначала строгий UTF-8, если не вышло - Windows-1251 (так сохраняет русский Excel).
  function decode(buf) {
    try { return { text: new TextDecoder("utf-8", { fatal: true }).decode(buf), enc: "UTF-8" }; }
    catch (e) { return { text: new TextDecoder("windows-1251").decode(buf), enc: "Windows-1251" }; }
  }

  // Разделитель: берём тот, которого больше в строке заголовка (запятая, точка с запятой, табуляция).
  function detectDelimiter(text) {
    var lines = text.split(/\r?\n/).filter(function (l) { return l.trim() !== ""; });
    var first = lines[0] || "", best = ",", n = -1;
    [",", ";", "\t"].forEach(function (d) {
      var c = first.split(d).length - 1;
      if (c > n) { n = c; best = d; }
    });
    return best;
  }

  function parseCSV(text, delim) {
    text = text.replace(/^﻿/, "");
    var rows = [], row = [], cur = "", q = false, i, c;
    function pushRow() {
      row.push(cur); cur = "";
      if (row.some(function (v) { return v.trim() !== ""; })) rows.push(row);
      row = [];
    }
    for (i = 0; i < text.length; i++) {
      c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === delim) { row.push(cur); cur = ""; }
      else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; pushRow(); }
      else cur += c;
    }
    pushRow();
    return rows;
  }

  function toRecords(text) {
    var delim = detectDelimiter(text.replace(/^﻿/, ""));
    var rows = parseCSV(text, delim);
    if (rows.length < 2) throw new Error("в файле нет строк с данными.");
    var head = rows[0].map(function (h) { return keyOf(h); });
    var iCity = head.indexOf("city"), iSrc = head.indexOf("source"), iPaid = head.indexOf("paid");
    if (iCity < 0 || iSrc < 0 || iPaid < 0)
      throw new Error("нужны колонки city, source и paid. Найдены: " + head.join(", "));

    var unknown = {}, unknownCount = 0, seen = {}, dups = 0;
    var hasId = head.some(function (h) { return ID_COLS.indexOf(h) >= 0; });

    var recs = rows.slice(1).map(function (r) {
      var raw = clean(r[iPaid]), k = keyOf(raw), status;
      if (PAID_YES.indexOf(k) >= 0) status = "yes";
      else if (PAID_NO.indexOf(k) >= 0) status = "no";
      else {
        status = "unknown"; unknownCount++;
        var label = raw === "" ? "пусто" : raw;
        unknown[label] = (unknown[label] || 0) + 1;
      }
      if (hasId) {
        var sig = r.map(keyOf).join("\u0001");
        if (seen[sig]) dups++; else seen[sig] = 1;
      }
      return { city: clean(r[iCity]) || "Не указан", source: clean(r[iSrc]) || "Не указан", status: status };
    });

    var notes = [];
    if (unknownCount) {
      notes.push("Статус оплаты не распознан у " + unknownCount + " строк (" +
        Object.keys(unknown).map(function (k) { return esc(k) + " ×" + unknown[k]; }).join(", ") +
        "). Они посчитаны как «не оплатили».");
    }
    if (dups) notes.push("Найдено полностью одинаковых строк: " + dups + ". Возможно, это дубли, они посчитаны как отдельные регистрации.");
    if (text.indexOf("�") >= 0) notes.push("В файле есть нечитаемые символы: проверьте кодировку файла.");
    return { recs: recs, notes: notes, delim: delim };
  }

  // Объединяет написания, которые различаются регистром, пробелами и е/ё.
  function group(recs, field, noteLabel, notes) {
    var m = {}, order = [];
    recs.forEach(function (r) {
      var raw = r[field], k = keyOf(raw), g = m[k];
      if (!g) { g = m[k] = { total: 0, paid: 0, forms: {} }; order.push(k); }
      g.total++; if (r.status === "yes") g.paid++;
      g.forms[raw] = (g.forms[raw] || 0) + 1;
    });
    var out = order.map(function (k) {
      var g = m[k], forms = Object.keys(g.forms), best = forms[0];
      forms.forEach(function (f) { if (g.forms[f] > g.forms[best]) best = f; });
      if (forms.length > 1)
        notes.push(noteLabel + ": объединены написания " + forms.map(function (f) { return "«" + esc(f) + "»"; }).join(", ") + ".");
      return { name: best, total: g.total, paid: g.paid };
    });
    return out.sort(function (a, b) { return b.total - a.total || a.name.localeCompare(b.name, "ru"); });
  }

  function line(name, t, p, bar) {
    var pc = pct(p, t);
    return "<tr><td>" + esc(name) + "</td><td>" + t + '</td><td class="ok">' + p + '</td><td class="bad">' + (t - p) +
      '</td><td><div class="pct"><span>' + pc + "%</span>" +
      (bar ? '<div class="track"><div class="fill" style="width:' + pc + '%"></div></div>' : "") +
      "</div></td></tr>";
  }

  function renderTable(id, firstCol, groups, total, paid) {
    var h = "<thead><tr><th>" + firstCol + "</th><th>Всего</th><th>Оплатили</th><th>Не оплатили</th><th>% оплаты</th></tr></thead><tbody>";
    groups.forEach(function (g) { h += line(g.name, g.total, g.paid, true); });
    h += "</tbody><tfoot>" + line("Итого", total, paid, false) + "</tfoot>";
    document.getElementById(id).innerHTML = h;
  }

  function setText(id, t) { document.getElementById(id).textContent = t; }

  function showWarn(notes) {
    var w = document.getElementById("warn");
    w.innerHTML = notes.length ? "<ul>" + notes.map(function (n) { return "<li>" + n + "</li>"; }).join("") + "</ul>" : "";
    w.style.display = notes.length ? "block" : "none";
  }

  function showError(t) {
    var m = document.getElementById("msg");
    m.textContent = t; m.style.display = t ? "block" : "none";
  }

  // При ошибке загрузки убираем старые цифры, чтобы их нельзя было принять за данные нового файла.
  function clearView() {
    ["k-total", "k-paid", "k-unpaid"].forEach(function (id) { setText(id, "—"); });
    setText("k-paid-pct", ""); setText("k-unpaid-pct", "");
    setText("src", "Файл не загружен");
    document.getElementById("t-source").innerHTML = "";
    document.getElementById("t-city").innerHTML = "";
    showWarn([]);
  }

  function render(parsed, label) {
    var recs = parsed.recs, notes = parsed.notes.slice();
    var total = recs.length, paid = recs.filter(function (r) { return r.status === "yes"; }).length;
    var bySource = group(recs, "source", "Каналы", notes);
    var byCity = group(recs, "city", "Города", notes);
    setText("k-total", total);
    setText("k-paid", paid);
    setText("k-unpaid", total - paid);
    setText("k-paid-pct", pct(paid, total) + "% от всех");
    setText("k-unpaid-pct", pct(total - paid, total) + "% от всех");
    var n10 = total % 10, n100 = total % 100;
    var word = n10 === 1 && n100 !== 11 ? "строка" : (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14) ? "строки" : "строк");
    setText("src", label + " · " + total + " " + word);
    renderTable("t-source", "Канал", bySource, total, paid);
    renderTable("t-city", "Город", byCity, total, paid);
    showWarn(notes);
    showError("");
  }

  render(toRecords(document.getElementById("data").textContent), "Данные: registrations.csv");

  var file = document.getElementById("file");
  document.getElementById("load").onclick = function () { file.click(); };
  file.onchange = function () {
    var f = file.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var d = decode(rd.result), parsed = toRecords(d.text), extra = [];
        if (d.enc !== "UTF-8") extra.push("кодировка " + d.enc);
        if (parsed.delim !== ",") extra.push("разделитель «" + (parsed.delim === "\t" ? "табуляция" : parsed.delim) + "»");
        render(parsed, "Данные: " + f.name + (extra.length ? " (" + extra.join(", ") + ")" : ""));
      } catch (e) {
        clearView();
        showError("Не удалось прочитать файл: " + e.message);
      }
    };
    rd.readAsArrayBuffer(f);
    file.value = "";
  };
})();
</script>
